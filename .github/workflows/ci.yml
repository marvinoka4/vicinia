name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Style check (no em dashes)
        run: python scripts/check_no_em_dash.py
      - name: Tests
        run: python -m pytest
      - name: Reproduce smoke run
        run: make smoke
