[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vicinia"
version = "0.1.0"
description = "Simulation and settlement engine for neighbourhood solar energy sharing in Nigeria"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Marvin Okafor" }]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "pvlib==0.16.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "hypothesis==6.170.11",
]

[project.scripts]
vicinia = "vicinia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
